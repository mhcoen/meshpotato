[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshpotato"
version = "1.5.0"
description = "MeshCore channel bot that answers messages with a local LLM, with a prompt injection gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael H. Coen", email = "mhcoen@gmail.com" }]
keywords = ["meshcore", "lora", "mesh", "chatbot", "llm", "ollama"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Ham Radio",
]
dependencies = [
  "meshcore>=2.3.9",
  "ollama>=0.6",
  "httpx>=0.27",
  "textual>=1.0",
  "confusables>=1.2",
  "psutil>=6,<8",
  "ddgs>=9.16,<10",
  "trafilatura>=2.2,<3",
  "beautifulsoup4>=4.14,<5",
  "certifi>=2024.2.2",
]

[project.urls]
Homepage = "https://github.com/mhcoen/meshpotato"
Issues = "https://github.com/mhcoen/meshpotato/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
meshpotato = "bot.cli:main"
meshai = "bot.cli:main" # compatibility with existing launch scripts

[tool.setuptools]
packages = ["bot"]

[tool.setuptools.package-data]
bot = ["radio_reference.toml", "EPISODIC-LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::SyntaxWarning:confusables",
]
